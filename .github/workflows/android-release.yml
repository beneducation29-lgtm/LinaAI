name: Android release

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: "Android versionCode (must be higher than the previous Play release)"
        required: true
        type: number
        default: 1
      version_name:
        description: "Android versionName, for example 1.0.0"
        required: true
        type: string
        default: "1.0.0"

permissions:
  contents: read

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  release-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Android release inputs
        env:
          ANDROID_VERSION_CODE: ${{ inputs.version_code }}
          ANDROID_VERSION_NAME: ${{ inputs.version_name }}
        run: node scripts/verify-android-release-inputs.mjs

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck web app
        run: npm run typecheck

      - name: Build web app
        run: npm run build

      - name: Generate Android project
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Prepare Android microphone permission
        run: node scripts/prepare-android.mjs

      - name: Prepare Android release metadata
        env:
          ANDROID_VERSION_CODE: ${{ inputs.version_code }}
          ANDROID_VERSION_NAME: ${{ inputs.version_name }}
        run: node scripts/prepare-android-release.mjs

      - name: Verify Capacitor setup
        run: npx cap doctor

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Prepare Android release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "Android release signing secrets are required for a production release."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/lina-ai-release.keystore"
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/lina-ai-release.keystore"
          npm run android:prepare-signing

      - name: Build release AAB
        working-directory: android
        run: ./gradlew bundleRelease

      - name: Verify signed Android release
        env:
          ANDROID_REQUIRE_SIGNING: "true"
        run: npm run android:verify-release

      - name: Generate Play preflight report
        run: |
          set -euo pipefail
          {
            echo "Lina AI Play release preflight"
            echo "Package: com.linaai.chinese"
            echo "Version name: ${{ inputs.version_name }}"
            echo "Version code: ${{ inputs.version_code }}"
            echo "Target SDK:"
            grep -E 'targetSdk(?:Version)?' android/app/build.gradle || true
            echo "Permissions:"
            grep -o 'android.permission.[A-Z_]*' android/app/src/main/AndroidManifest.xml | sort -u || true
            echo "Privacy/Data Safety: configure in Play Console before production/closed testing."
            echo "Internal testing can be used before completing full app setup."
          } > android/app/build/outputs/bundle/release/play-preflight.txt

      - name: Verify AAB signature
        run: jarsigner -verify -verbose -certs android/app/build/outputs/bundle/release/app-release.aab >/dev/null

      - name: Validate AAB with bundletool
        env:
          BUNDLETOOL_VERSION: "1.18.2"
        run: |
          set -euo pipefail
          curl -fsSL -o bundletool.jar "https://github.com/google/bundletool/releases/download/${BUNDLETOOL_VERSION}/bundletool-all-${BUNDLETOOL_VERSION}.jar"
          java -jar bundletool.jar validate --bundle android/app/build/outputs/bundle/release/app-release.aab

      - name: Verify compiled AAB manifest
        env:
          ANDROID_VERSION_CODE: ${{ inputs.version_code }}
          ANDROID_VERSION_NAME: ${{ inputs.version_name }}
        run: node scripts/verify-android-aab-manifest.mjs

      - name: Build local-testing APK set
        run: |
          set -euo pipefail
          java -jar bundletool.jar build-apks \
            --bundle=android/app/build/outputs/bundle/release/app-release.aab \
            --output=android/app/build/outputs/bundle/release/lina-ai-local-testing.apks \
            --local-testing

      - name: Validate local-testing APK set
        run: |
          java -jar bundletool.jar validate --apks android/app/build/outputs/bundle/release/lina-ai-local-testing.apks

      - name: Generate artifact checksums
        run: |
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk > android/app/build/outputs/apk/debug/app-debug.apk.sha256
          sha256sum android/app/build/outputs/bundle/release/app-release.aab > android/app/build/outputs/bundle/release/app-release.aab.sha256

      - name: Generate release manifest summary
        run: |
          set -euo pipefail
          {
            echo "Lina AI Android release"
            echo "versionCode=${{ inputs.version_code }}"
            grep -E 'applicationId|versionName|targetSdk' android/app/build.gradle || true
            echo "AAB SHA256:"
            cat android/app/build/outputs/bundle/release/app-release.aab.sha256 2>/dev/null || true
          } > android/app/build/outputs/bundle/release/release-summary.txt

      - name: Create Play release manifest
        run: |
          set -euo pipefail
          AAB_SHA256=$(cut -d " " -f1 android/app/build/outputs/bundle/release/app-release.aab.sha256)
          TARGET_SDK=$(grep -E "targetSdk(?:Version)?" android/app/build.gradle | head -n1 | grep -oE "[0-9]+" | tail -n1)
          APPLICATION_ID=$(grep -E "applicationId" android/app/build.gradle | head -n1 | sed -E "s/.*[\"\x27]([^\"\x27]+)[\"\x27].*/\1/")
          printf "%s\n" "{\"package\":\"$APPLICATION_ID\",\"versionName\":\"${{ inputs.version_name }}\",\"versionCode\":${{ inputs.version_code }},\"targetSdk\":$TARGET_SDK,\"aabSha256\":\"$AAB_SHA256\"}" > android/app/build/outputs/bundle/release/release-manifest.json

      - name: Create Play upload package
        run: |
          set -euo pipefail
          mkdir -p android/app/build/outputs/play-upload
          cp android/app/build/outputs/bundle/release/app-release.aab android/app/build/outputs/play-upload/
          cp android/app/build/outputs/bundle/release/app-release.aab.sha256 android/app/build/outputs/play-upload/
          cp android/app/build/outputs/bundle/release/release-summary.txt android/app/build/outputs/play-upload/
          cp android/app/build/outputs/bundle/release/release-manifest.json android/app/build/outputs/play-upload/
          cat > android/app/build/outputs/play-upload/README.txt <<'EOF'
Lina AI Android release package

1. Upload app-release.aab to Google Play Console > Testing > Internal testing.
2. Confirm the package is com.linaai.chinese before creating the release.
3. Use the generated release-manifest.json and SHA256 file to record the exact artifact.
4. Complete Play Console app-content, store-listing, privacy-policy and Data safety requirements as applicable.
5. After internal testing, move to closed testing/production only when the Play Console requirements for the developer account are satisfied.

This package does not publish the app automatically.
EOF
          printf '%s\n' '{"technicalPipeline":"READY","signedAab":"READY","compiledManifest":"VERIFIED","playUploadPackage":"READY","internalTesting":"MANUAL_PLAY_CONSOLE","production":"BLOCKED_UNTIL_PLAY_CONSOLE_REQUIREMENTS"}' > android/app/build/outputs/play-upload/release-readiness.json

      - name: Verify Play upload package
        env:
          ANDROID_VERSION_CODE: ${{ inputs.version_code }}
          ANDROID_VERSION_NAME: ${{ inputs.version_name }}
        run: npm run android:verify-play-upload

      - name: Generate production gate report
        run: |
          set -euo pipefail
          mkdir -p android/app/build/outputs/play-upload
          cat > android/app/build/outputs/play-upload/production-gate.txt <<'EOF'
Lina AI — Production Release Gate

AUTOMATED: READY
- Android release inputs validated
- Signed AAB verification enabled
- Target SDK 36+ validation enabled
- Compiled manifest/version consistency enabled
- AAB checksum validation enabled
- Play upload package validation enabled
- Android smoke-test evidence gate enabled

MANUAL: REQUIRED
- Generate and download the first signed AAB
- Upload to Google Play Internal testing
- Complete Play Console store listing and App content
- Publish accurate privacy policy and complete Data safety declarations as applicable
- Complete real-device release smoke testing
- Complete closed testing requirements if applicable
- Obtain production access before production publishing

PRODUCTION STATUS: BLOCKED_UNTIL_MANUAL_GATES_COMPLETE
EOF

      - name: Generate release handoff manifest
        run: |
          set -euo pipefail
          cat > android/app/build/outputs/play-upload/release-handoff.json <<'EOF'
          {
            "app": "Lina AI",
            "packageId": "com.linaai.chinese",
            "versionName": "${{ inputs.version_name }}",
            "versionCode": ${{ inputs.version_code }},
            "technicalPipeline": "READY",
            "signedAab": "READY",
            "googlePlayTargetApiRequired": 36,
            "targetApiCompliant": true,
            "internalTesting": "MANUAL_REQUIRED",
            "realDeviceSmokeTest": "MANUAL_REQUIRED",
            "playConsolePolicySetup": "MANUAL_REQUIRED",
            "productionAccess": "MANUAL_REQUIRED",
            "productionPublish": "BLOCKED"
          }
          EOF

      - name: Verify release handoff manifest
        env:
          ANDROID_VERSION_CODE: ${{ inputs.version_code }}
          ANDROID_VERSION_NAME: ${{ inputs.version_name }}
        run: node scripts/verify-release-handoff.mjs

      - name: Verify production gate report
        run: node scripts/verify-production-gate.mjs

      - name: Verify Android smoke test evidence
        run: node scripts/verify-android-smoke-test-evidence.mjs

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lina-ai-android-release-${{ inputs.version_code }}
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/app-debug.apk.sha256
            android/app/build/outputs/bundle/release/app-release.aab.sha256
            android/app/build/outputs/bundle/release/lina-ai-local-testing.apks
            android/app/build/outputs/bundle/release/release-summary.txt
            android/app/build/outputs/bundle/release/play-preflight.txt
            android/app/build/outputs/bundle/release/release-manifest.json
            android/app/build/outputs/play-upload/
            docs/android-release-smoke-test.md
            android/app/build/outputs/play-upload/production-gate.txt
            android/app/build/outputs/play-upload/release-handoff.json
          if-no-files-found: error
          retention-days: 30

      - name: Clean signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/lina-ai-release.keystore"
